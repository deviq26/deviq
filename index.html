    <!-- GitHub Pages Single Page Apps Routing Script -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&') 
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>

  <body class="bg-[#f7f6f2] text-slate-900 antialiased selection:bg-teal-500/20 selection:text-teal-950 overflow-x-hidden min-h-screen">
